name: CI

on:
  # Stacked pull requests need the same checks as pull requests into main.
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # releases/v6, 2026-07-16
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # releases/v6, 2026-07-23
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  stacked-base:
    name: Stacked base tests
    if: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # releases/v6, 2026-07-16
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Verify tested base revision
        env:
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'Expected base: %s\nActual checkout: %s\n' "$EXPECTED_BASE_SHA" "$actual"
          test "$actual" = "$EXPECTED_BASE_SHA"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # releases/v6, 2026-07-23
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
